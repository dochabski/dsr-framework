decision_record:
  id: record_decision_0001_whitepaper_type_and_platforms
  status: approved
  date: '2026-05-18'
  decision: Use a repository-native methodological white paper with an open artifact package.
  rationale:
    - The contribution is conceptual, methodological, and infrastructural.
    - The source materials already distinguish DSR theory from repository operationalization.
    - The DSR Framework repository is itself a compound artifact package.
    - The publication path should preserve canonicality while increasing visibility.
  canonical_platforms:
    - GitHub
    - Zenodo
  secondary_platforms:
    - OSF
    - Octopus
  dissemination_only:
    - ResearchGate
    - Academia.edu
    - LinkedIn
    - Substack
    - ORCID
  data_only_optional:
    - Mendeley Data
    - Dryad
  non_goals:
    - Treating a dataset repository as the primary home for the white paper.
    - Creating multiple competing canonical copies.
    - Claiming L5 status before release evidence exists.
