rubric:
  rubric_metadata:
    id: reliability_replication_readiness_rubric
    label: Reliability and Replication Readiness Rubric
    version: 0.1.0-draft
    status: draft
    generated_on: '2026-05-15'
    generated_by: gpt_5_5_thinking
    intended_file_path: rubrics/reliability_replication_readiness_rubric.yaml
    local_file_name: reliability_replication_readiness_rubric.yaml
    assessment_target: validity_reliability_space
    priority: recommended
    lifecycle_phase: validity_reliability_and_accumulation
    prompt_id: prompt_reliability_replication_readiness_rubric
    rubric_generation_spec_id: dsr_rubric_generation_spec_v0_1_0
    depends_on:
    - contribution_quality_rubric
    - transparency_trace_quality_rubric
    documentation_protocol_alignment:
      identifier_policy: stable_ascii_lowercase_snake_case_for_ids_and_keys
      repository_path_policy: caller_places_file_manually; intended path retained as metadata
      traceability_policy: source_supported_claims_and_reviewer_judgment_are_distinguished
      obligation_policy: machine_validation_checks_presence_consistency_trace_shape_controlled_values_and_material_availability;
        adequacy_judgments_remain_human_review
      scope_policy: theory_of_dsr_and_repository_operationalization_are_distinguished
  assessment_scope:
    primary_question: Can the artifact, method, measure, design knowledge, process, or evaluation be reliably assessed or
      replicated under stated conditions?
    when_to_use:
    - before publication
    - before repository release
    - before designing a replication study
    - before claiming that an artifact, method, measure, evaluation, or design-knowledge contribution is dependable beyond
      a single undocumented assessment
    - when preparing cumulative knowledge synthesis, evidence comparison, or meta-replication materials
    - whenever versioning, procedure, measures, evaluation protocol, implementation context, or boundary conditions materially
      change
    when_not_to_use:
    - do not use before a minimally specified reliability_target exists
    - do not use as a substitute for contribution_quality_rubric; a reproducible record may still make a weak contribution
    - do not use as a substitute for transparency_trace_quality_rubric; replication readiness depends on transparency but
      also evaluates reliability target, materials, procedures, measures, and replication type fit
    - do not use as proof of artifact utility, statistical validity, generalizability, ethical acceptability, or production
      readiness
    - do not require exact reproduction when DSR theory or artifact mutability makes adaptation, update, recreation, or explanation
      the more appropriate replication mode
    - do not convert recommended replication materials into hard public-disclosure requirements when privacy, security, intellectual
      property, or ethical redaction is necessary
    intended_users:
    - dsr_researcher
    - doctoral_student
    - faculty_advisor
    - repository_reviewer
    - methodologist
    - journal_or_conference_reviewer
    - quality_assurance_reviewer
    - practice_partner_reviewer
    - technical_implementer
    - artifact_maintainer
    - replication_or_reuse_reviewer
    - evidence_synthesis_reviewer
    unit_of_assessment: one_validity_reliability_space_record_for_a_candidate_or_completed_dsr_study
    boundary_conditions:
    - The rubric assesses readiness for reliable assessment or replication under stated conditions, not whether the original
      study is substantively correct.
    - Reliability may concern an artifact, method, measure, evaluator process, implementation procedure, evaluation protocol,
      or design knowledge; the target must be explicit.
    - Synchronic reliability concerns consistency at a given time or across evaluators, observers, settings, users, or assessment
      conditions.
    - Diachronic reliability concerns stability, interpretability, and comparability over time, versions, repeated uses, or
      changing contexts.
    - Replication in DSR may involve test, redesign, justification, adaptation, explanation, update, recreation, or meta-replication
      rather than only exact duplication.
    - Appropriate evidence depends on artifact type, maturity, risk, claim scope, boundary conditions, and intended replication
      type.
    - Machine validation may check field presence, controlled values, identifiers, version links, and material availability;
      adequacy, sufficiency, and replication-type fit require human review.
    assumptions:
    - Reliability is a validity support, not a replacement for validity.
    - Replication readiness requires codified materials and procedures proportionate to the claim being made.
    - Reliability claims must not hide context dependence, artifact mutability, or version-specific findings.
    - Design knowledge accumulates more responsibly when materials, measures, conditions, and variation are documented for
      comparison and reuse.
  source_grounding:
