    - brendel_lembcke_muntermann_kolbe_2021_replication_study_types_for_dsr
    - reining_ahlemann_mueller_thakurta_2022_knowledge_accumulation_dsr
    - concept_inventory.validity_reliability_terms
    - dsr_skos_controlled_vocabulary.validity_reliability_terms
    - dsr_ontology_competency_questions.validity_reliability_and_traceability
    - dsr_operational_synthesis.validity_reliability_and_accumulation
    - transparency_trace_quality_rubric
    - contribution_quality_rubric
    required_framework_files:
    - concept-inventory_v2.yaml
    - DSR Operational Synthesis.txt
    - Theory of Design Science Research.txt
    - dsr-source-operational-extractions-unified-part002.yaml
    - dsr_skos_controlled_vocabulary.yaml
    - dsr_ontology_competency_questions.yaml
    - dsr_rubric_generation_spec_v0_1_0.yaml
    - dsr_rubric_generation_prompts_v0_1_0.txt
    source_anchor_policy:
      minimum: Every major reliability, replication, or accumulation rationale should cite a source_anchor_id, framework_anchor,
        validation_result, repository_artifact, or explicit reviewer_judgment marker.
      preferred: Use Storey et al. reliability anchors for reliability target and synchronic/diachronic timing; Brendel et
        al. anchors for replication types; Reining et al. anchors for accumulation and codification; concept-inventory anchors
        for controlled vocabulary and schema alignment.
      do_not_do: Do not label a claim as source_supported when it is inferred from reviewer judgment, missing documentation,
        or local project practice.
    unsupported_claim_policy:
      rule: Claims about reliability, reproducibility, replication readiness, transfer, accumulation, or generality must be
        marked unsupported when they lack evidence or traceable materials.
      effect: Unsupported claims trigger human_review and may activate non_compensatory_floor_rules.
    source_supported_claims:
    - claim_id: src_claim_reliability_targets_and_timing
      claim: DSR reliability can target artifact, method, measures, or design knowledge and can be considered synchronically
        or diachronically.
      source_family: storey_baskerville_kaul_2025_reliability_in_design_science_research
      source_anchor_ids:
      - storey_2025:A017
      - storey_2025:A020
      - storey_2025:A021
      - storey_2025:A022
      - storey_2025:A023
      obligation_status: source_supported
    - claim_id: src_claim_replication_types_plural
      claim: DSR replication includes multiple study types oriented to utility, adaptation, explanation, update, recreation,
