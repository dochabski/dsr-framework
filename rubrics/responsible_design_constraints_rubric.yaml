    source_anchor_policy:
      minimum: Every major responsible-design claim should cite a source_anchor_id, framework_anchor, institutional_policy_reference, stakeholder_claim_id,
        repository_artifact_id, or reviewer_judgment marker.
      preferred: Use source anchors for DSR transparency, context, stakeholder burden, artifact boundaries, evaluation controls, traceability,
        anti-patterns, and documentation-protocol obligations.
      do_not_do: Do not present a reviewer assumption, undocumented practice, or general ethical intuition as source-supported evidence.
      redaction_note: Sensitive security, privacy, legal, or stakeholder-risk details may be represented by controlled references, summaries,
        or non-public annex identifiers rather than full public disclosure.
    unsupported_claim_policy:
      rule: Claims that a constraint is resolved, acceptable, compliant, approved, secure, private, maintainable, licensed, or low-risk must be
        marked unsupported unless evidence and owner/status are present.
      effect: Unsupported claims trigger human_review and may activate non_compensatory_floor_rules.
      examples:
      - privacy_risk_low_without_data_inventory
      - security_risk_low_without_threat_or_misuse_review
      - stakeholder_burden_acceptable_without_burden_assessment
      - open_reuse_permitted_without_license_or_ip_status
      - sustainable_after_release_without_maintenance_owner
    source_supported_claims:
