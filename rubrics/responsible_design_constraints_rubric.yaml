rubric:
  rubric_metadata:
    id: responsible_design_constraints_rubric
    label: Responsible Design Constraints Rubric
    version: 0.1.0-draft
    status: draft
    generated_on: '2026-05-15'
    generated_by: gpt_5_5_thinking
    intended_file_path: rubrics/responsible_design_constraints_rubric.yaml
    local_file_name: responsible_design_constraints_rubric.yaml
    assessment_target: responsible_design_constraints
    priority: recommended
    lifecycle_phase: responsible_design_and_governance
    prompt_id: prompt_responsible_design_constraints_rubric
    rubric_generation_spec_id: dsr_rubric_generation_spec_v0_1_0
    depends_on:
    - context_stakeholder_adequacy_rubric
    - artifact_specification_quality_rubric
    - demonstration_use_readiness_rubric
    documentation_protocol_alignment:
      identifier_policy: stable_ascii_lowercase_snake_case_for_ids_and_keys
      repository_path_policy: caller_places_file_manually; intended path retained as metadata
      traceability_policy: source_supported_claims_and_reviewer_judgment_are_distinguished
      obligation_policy: machine_validation_checks_presence_consistency_trace_shape_and_controlled_values; adequacy_judgments_remain_human_review
      scope_policy: theory_of_dsr_and_repository_operationalization_are_distinguished
      responsible_release_policy: public_repository_release_may_require_redaction_or_controlled_disclosure_for_sensitive_details
  assessment_scope:
    primary_question: Are ethical, privacy, security, IP, maintenance, sustainability, and stakeholder-burden constraints identified and managed?
    when_to_use:
    - during problem framing when affected stakeholders, harms, burdens, consent issues, or governance constraints are being discovered
    - during artifact specification when privacy, security, IP, maintenance, or sustainability constraints shape artifact capacities and boundaries
    - during use planning before demonstration, field use, pilot, scenario walk-through, proof of concept, or proof of value
    - during evaluation planning before collecting data, observing users, logging activity, or reporting findings
    - before repository release, public sharing, reuse, adaptation, or practitioner handoff
    - whenever artifact scope, data use, stakeholder exposure, ownership, licensing, security posture, or maintenance responsibility materially
      changes
    when_not_to_use:
    - do not use as a substitute for institutional review board, legal, privacy office, security review, accessibility review, records-retention,
      procurement, or contractual approval when those are required
    - do not use as a substitute for context_stakeholder_adequacy_rubric; stakeholder identification must be adequate before burdens can be responsibly
      assessed
    - do not use as a substitute for artifact_specification_quality_rubric; artifact boundaries and capacities must be specified enough to identify
      constraints
    - do not use as a substitute for demonstration_use_readiness_rubric; this rubric evaluates responsible-design constraints, not readiness to
      produce meaningful evidence
    - do not treat a high score as proof that all harms have been prevented, that legal compliance is complete, or that the artifact is ethically
      justified in every receiving context
    - do not force confidential security details, sensitive risk information, personal data, or proprietary material into public release when
      controlled disclosure is the responsible action
    intended_users:
    - dsr_researcher
    - doctoral_student
    - faculty_advisor
    - repository_reviewer
    - methodologist
    - quality_assurance_reviewer
    - practice_partner_reviewer
    - privacy_or_data_governance_reviewer
    - security_reviewer
    - legal_or_ip_reviewer
    - artifact_designer
    - technical_implementer
    - evaluation_lead
    - artifact_maintainer
    - stakeholder_representative
    unit_of_assessment: one_responsible_design_constraints_record_for_a_candidate_active_or_release_ready_dsr_study
    boundary_conditions:
    - The rubric assesses whether responsible-design constraints are identified, mitigated, assigned, traced, and release-bounded; it does not
      itself grant ethical, legal, security, or institutional approval.
    - Responsible-design depth should be proportionate to artifact risk, data sensitivity, stakeholder burden, evaluation exposure, public release
      scope, and reuse ambitions.
    - Low-risk conceptual rubrics, templates, taxonomies, and process maps can score well with lighter controls when they explicitly justify why
      heavier controls are not applicable.
    - Data-intensive, human-participant, compliance-sensitive, security-sensitive, minors-involved, workplace-monitoring, or automated-decision
      artifacts require stronger evidence, documented approvals, and human review.
    - Machine validation can test presence, identifiers, controlled values, status fields, trace links, and missing critical sections; ethical
      adequacy, privacy reasonableness, security sufficiency, burden proportionality, and overclaiming require human judgment.
    assumptions:
    - Responsible design is cross-cutting across problem framing, artifact specification, use planning, evaluation planning, contribution scoping,
      and repository release.
    - Constraints are not merely barriers; they are design inputs that should shape requirements, artifact boundaries, use plans, evaluation controls,
      release conditions, and maintenance responsibilities.
    - Stakeholder burden includes direct and indirect burden, including time, cognitive load, surveillance exposure, inequitable effects, operational
      disruption, maintenance workload, and opportunity cost.
    - A responsible DSR record distinguishes source-supported constraints, institutional policy constraints, stakeholder claims, practitioner
      judgment, and reviewer judgment.
