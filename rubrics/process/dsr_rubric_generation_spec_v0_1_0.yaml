rubric_generation_spec:
  metadata:
    id: dsr_rubric_generation_spec_v0_1_0
    title: DSR Framework Rubric Generation Specification
    version: 0.1.0-draft
    generated_on: '2026-05-09'
    generated_by: GPT-5.5 Thinking
    normative_status: planning_specification_for_future_rubric_artifacts
    primary_repository: https://github.com/dochabski/dsr-framework
    documentation_protocol_repository: https://github.com/dochabski/documentation-protocol
    intended_repository_directory: rubrics/
    purpose: Specify the required elements, structure, and generation expectations for individually generated DSR assessment
      rubrics.
    usage_note: Use this specification to generate one fully developed rubric at a time so that each rubric has sufficient
      space for scoring levels, anchors, weights, calibration guidance, and decision thresholds.
  repo_context_rules:
  - Distinguish DSR theory from this repository's operationalization of DSR.
  - Prefer repository artifacts and source-backed extraction records when assigning terms, identifiers, controlled values,
    and validation implications.
  - Preserve source-supported distinctions and do not convert soft guidance into hard validation unless the source and framework
    explicitly support that obligation level.
  - Use stable ASCII lowercase snake_case identifiers for YAML keys, rubric IDs, dimension IDs, validation rule IDs, and file
    names.
  - Every assessment claim should be traceable to source anchors, framework concepts, or explicitly labeled reviewer judgment.
  - Rubrics should support human review and machine-readable validation, but should not pretend that human judgment can be
    eliminated for adequacy, significance, novelty, ethics, or evidence sufficiency.
  global_rubric_artifact_requirements:
    required_top_level_sections:
    - rubric_metadata
    - assessment_scope
    - source_grounding
    - construct_definitions
    - required_inputs
    - required_outputs
    - assessment_dimensions
    - scoring_model
    - level_descriptors
    - evidence_requirements
    - calibration_guidance
    - decision_thresholds
    - interpretation_guidance
    - anti_patterns_and_warnings
    - traceability_requirements
    - validation_implications
    - examples_or_scoring_vignettes
    - quality_control
    - revision_history
    each_rubric_must_include:
      rubric_metadata:
      - id
      - label
      - version
      - status
      - generated_on
      - generated_by
      - intended_file_path
      - assessment_target
      - priority
      - lifecycle_phase
      assessment_scope:
      - primary_question
      - when_to_use
      - when_not_to_use
      - intended_users
      - unit_of_assessment
      - boundary_conditions
      source_grounding:
      - source_families_to_consult
      - required_framework_files
      - source_anchor_policy
      - unsupported_claim_policy
      construct_definitions:
      - controlled_terms
      - local_definitions
      - distinctions_to_preserve
      - terms_not_to_conflate
      required_inputs:
      - input_field
      - description
      - obligation_status
      - accepted_format
      - minimum_evidence
      required_outputs:
      - rating_fields
      - decision_fields
      - gap_fields
      - recommended_actions
      - human_review_flags
      assessment_dimensions:
      - dimension_id
      - label
      - definition
      - weight
      - score_direction
      - required
      - evidence_needed
      - level_descriptors
      - calibration_notes
      - common_failure_modes
      scoring_model:
      - scale
      - score_direction
      - weight_sum_rule
      - missing_evidence_rule
      - reverse_scoring_rule
      - non_compensatory_floor_rules
      level_descriptors:
      - score_0
      - score_1
      - score_2
      - score_3
      - score_4
      - anchor_examples
      - borderline_cases
      evidence_requirements:
      - minimum_evidence_by_dimension
      - acceptable_evidence_modes
      - source_anchor_requirements
      - evidence_quality_notes
      calibration_guidance:
      - reviewer_preparation
      - anchor_examples
      - calibration_rounds
      - inter_rater_reconciliation
      - drift_checks
      decision_thresholds:
      - proceed_or_ready_threshold
      - revise_threshold
      - stop_or_reframe_threshold
      - dimension_floor_rules
      - human_review_triggers
      interpretation_guidance:
      - how_to_read_scores
      - what_not_to_infer
      - relationship_to_adjacent_rubrics
      - known_limitations
      anti_patterns_and_warnings:
      - anti_pattern_id
      - warning_condition
      - severity
      - recommended_response
      traceability_requirements:
      - source_to_concept
      - concept_to_schema_field
      - problem_to_requirement
      - requirement_to_design_decision
      - design_decision_to_evaluation
      - evaluation_to_design_knowledge
      - design_knowledge_to_contribution
      - evidence_to_claim
      validation_implications:
      - json_schema_fields
      - shacl_shapes_or_warnings
      - controlled_vocabularies
      - python_validation_logic
      - manual_review_only_checks
      examples_or_scoring_vignettes:
      - valid_example
      - borderline_example
      - invalid_or_warning_example
      quality_control:
      - completeness_check
      - ambiguity_check
      - human_review_recommendation
      - source_gap_notes
      revision_history:
      - version
      - date
      - change_summary
      - changed_by
    each_dimension_must_include:
    - dimension_id
    - label
    - definition
    - weight
    - required
    - score_direction
    - score_0_descriptor
    - score_1_descriptor
    - score_2_descriptor
    - score_3_descriptor
    - score_4_descriptor
    - minimum_evidence
    - high_quality_evidence
    - weak_evidence_signals
    - calibration_anchor
    - common_failure_modes
    - reviewer_notes
  controlled_vocabularies:
    priority_values:
    - core
    - recommended
    - advanced
    - source_dependent
    rubric_status_values:
    - planned
    - draft
    - review_ready
    - approved
    - deprecated
    obligation_status_values:
    - required
    - recommended
    - optional
    - conditional
    - contested
    - not_addressed
    - not_applicable
    ambiguity_values:
    - low
    - medium
    - high
    score_scale_default:
      '0': absent_or_blocked
      '1': weak_or_asserted
      '2': conditional_or_partially_supported
      '3': strong_or_adequately_supported
      '4': very_strong_or_exemplary
    severity_values:
    - info
    - warning
    - major_warning
    - blocking_issue
    evidence_mode_values:
    - source_anchor
    - literature_synthesis
    - empirical
    - expert
    - field
    - case
    - simulation
    - experiment
    - analytics
    - artifact_inspection
    - conceptual_argument
    - stakeholder_claim
    - repository_artifact
    - validation_result
    - reviewer_judgment
    decision_value_policy: Each rubric may define its own final decision values, but must map them to proceed/ready, revise/constrain,
      reframe/prepare, or stop/not-ready categories.
  recommended_output_file_pattern: rubrics/{rubric_id}.yaml
  rubric_backlog:
  - generation_order: 1
    id: problem_research_worthiness_rubric
    label: Problem Research-Worthiness Rubric
    priority: core
    lifecycle_phase: problem_selection_and_framing
    assessment_target: problem_space.research_worthiness
    primary_question: Is this problem worth treating as DSR rather than routine practice improvement or consulting?
    output_path: rubrics/problem_research_worthiness_rubric.yaml
    when_to_use: Before artifact development, after an initial problem instance and candidate problem class have been stated.
    required_inputs:
    - problem_instance
    - problem_class
    - relevance_justification
    - research_front_or_gap
    - candidate_contribution_claim
    - constraints
    required_outputs:
    - overall_research_worthiness_rating
    - novelty_rationale
    - significance_rationale
    - tractability_rationale
    - routine_design_risk
    - decision
    dimensions:
    - id: novelty
      default_weight: 0.25
      required: true
      description: Extent to which the problem framing, expected artifact, method, evaluation, or design knowledge advances
        beyond settled knowledge.
    - id: significance
      default_weight: 0.25
      required: true
      description: Practical, stakeholder, organizational, societal, scholarly, or methodological importance.
    - id: tractability
      default_weight: 0.2
      required: true
      description: Credible ability to investigate, design, demonstrate, and evaluate within constraints.
    - id: problem_class_abstraction
      default_weight: 0.1
      required: true
      description: Quality of abstraction from situated problem instance to reusable problem class.
    - id: research_front_positioning
      default_weight: 0.1
      required: true
      description: Explicit positioning against prior research, current gap, or unresolved front.
    - id: routine_design_risk
      default_weight: 0.1
      required: true
      reverse_scored: true
      description: Risk that the work is only local application of known techniques without research contribution.
    decision_values:
    - proceed
    - proceed_with_constraints
    - reframe
    - treat_as_practice_project
    - reject_or_defer
    anti_patterns:
    - streetlight_problem_selection
    - myopic_problem_formulation
    - routine_design_overclaim
    - weak_problem_class_abstraction
    - novelty_assertion_without_research_front
    dependencies: []
    source_families_to_consult:
    - concept_inventory.problem_space
    - Purao problem-source and research-worthiness extraction
    - DSR Operational Synthesis problem-space sections
    - Theory of DSR consensus commitments
    prompt_id: prompt_problem_research_worthiness_rubric
  - generation_order: 2
    id: problem_solvability_rubric
    label: Problem Solvability Rubric
    priority: core
    lifecycle_phase: problem_selection_and_framing
    assessment_target: problem_space.solvability_assessment
    primary_question: Can this DSR problem plausibly be addressed through an artifact, intervention, or design entity under
      known constraints?
    output_path: rubrics/problem_solvability_rubric.yaml
    when_to_use: Before detailed requirements and artifact design; revisit after access, governance, or resource conditions
      change.
    required_inputs:
    - problem_instance
    - problem_class
    - stakeholders
    - context
    - resources
    - governance_conditions
    - access_conditions
    - candidate_evaluation_route
    required_outputs:
    - overall_solvability_rating
    - blockers
    - mitigations
    - scope_constraints
    - decision
    dimensions:
    - id: feasibility
      default_weight: 0.15
      required: true
      description: Plausibility under time, technique, data, and methodological constraints.
    - id: access
      default_weight: 0.15
      required: true
      description: Access to people, settings, systems, documents, data, or practices needed for design and evaluation.
    - id: resource_sufficiency
      default_weight: 0.15
      required: true
      description: Availability of financial, human, technical, data, infrastructure, and expertise resources.
    - id: governance_readiness
      default_weight: 0.15
      required: true
      description: Decision rights, approvals, accountability, ownership, privacy, security, IP, and maintenance feasibility.
    - id: operational_intervention_capacity
      default_weight: 0.15
      required: true
      description: Capacity of the setting to absorb prototype, pilot, implementation, or process change.
    - id: evaluation_possibility
      default_weight: 0.15
      required: true
      description: Credibility of evaluating success, utility, failure, or learning.
    - id: risk_payoff_balance
      default_weight: 0.05
      required: true
      description: Balance of expected benefit against risk, burden, reversibility, and opportunity cost.
    - id: knowledge_contribution_potential
      default_weight: 0.05
      required: true
      description: Potential for projectable or reusable design knowledge from solving the problem.
    decision_values:
    - proceed
    - proceed_with_scope_constraints
    - prepare_prerequisites
    - reframe
    - abandon_or_defer
    anti_patterns:
    - false_feasibility
    - access_assumption
    - governance_blind_spot
    - unevaluable_problem
    - overbroad_problem_scope
    dependencies:
    - problem_research_worthiness_rubric
    source_families_to_consult:
    - concept_inventory.solvability_assessment
    - DSR externalities and prerequisite-space records
    - Purao solvability and tractability extraction
    - Wicked Problem Workflow
    prompt_id: prompt_problem_solvability_rubric
  - generation_order: 3
    id: problem_framing_quality_rubric
    label: Problem Framing Quality Rubric
    priority: core
    lifecycle_phase: problem_framing
    assessment_target: problem_space.problem_framing
    primary_question: Is the problem represented clearly enough to support DSR design, evaluation, and contribution claims?
    output_path: rubrics/problem_framing_quality_rubric.yaml
    when_to_use: After raw problem capture and before objectives, requirements, and artifact design are finalized.
    required_inputs:
    - raw_problem_situation
    - problem_instance_statement
    - problem_class_statement
    - stakeholder_claims
    - wickedness_profile
    - boundary_conditions
    required_outputs:
    - problem_framing_rating
    - framing_gaps
    - reframing_recommendations
    - problem_instance_to_class_trace
    dimensions:
    - id: problem_instance_clarity
      default_weight: 0.18
      required: true
      description: Specificity of local setting, stakeholders, unwanted condition, mechanisms, and consequences.
    - id: problem_class_abstraction
      default_weight: 0.18
      required: true
      description: Quality of abstraction from local instance to recurring problem class.
    - id: problem_motivation_and_evidence
      default_weight: 0.16
      required: true
      description: Evidence for relevance, severity, frequency, or importance.
    - id: stakeholder_burden_and_value
      default_weight: 0.14
      required: true
      description: Representation of who is harmed, helped, responsible, resistant, or affected.
    - id: wickedness_and_ambiguity_profile
      default_weight: 0.12
      required: true
      description: Explicit handling of ambiguity, conflict, circular causality, shifting constraints, and uncertain criteria.
    - id: boundary_conditions
      default_weight: 0.12
      required: true
      description: Scope limits, contextual conditions, and negative applicability conditions.
    - id: representation_change_trace
      default_weight: 0.1
      required: false
      description: Documentation of how the problem representation evolved during inquiry.
    decision_values:
    - accept_framing
    - accept_with_minor_revision
    - reframe_before_design
    - insufficient_for_dsr
    anti_patterns:
    - symptom_as_problem
    - solution_in_disguise
    - overlocalization
    - overabstraction
    - stakeholder_erasure
    - unbounded_problem
    dependencies:
    - problem_research_worthiness_rubric
    - problem_solvability_rubric
    source_families_to_consult:
    - Maedche et al. problem-space conceptualization extraction
    - Purao problem-source extraction
    - Wicked Problem Workflow
    - concept_inventory.problem_space
    prompt_id: prompt_problem_framing_quality_rubric
  - generation_order: 4
    id: context_stakeholder_adequacy_rubric
    label: Context and Stakeholder Adequacy Rubric
    priority: core
    lifecycle_phase: contextualization
    assessment_target: context_space
    primary_question: Does the DSR record describe context, stakeholders, artifact networks, and boundary conditions well
      enough to interpret design and evaluation claims?
    output_path: rubrics/context_stakeholder_adequacy_rubric.yaml
    when_to_use: During problem framing, artifact design, evaluation planning, and contribution scoping.
    required_inputs:
    - context_description
    - stakeholder_map
    - artifact_network
    - boundary_condition_register
    - governance_and_resource_context
    required_outputs:
    - context_adequacy_rating
    - stakeholder_coverage_gaps
    - boundary_condition_gaps
    - projectability_constraints
    dimensions:
    - id: context_completeness
      default_weight: 0.18
      required: true
      description: Coverage of organizational, technical, social, regulatory, temporal, cultural, resource, and governance
        context.
    - id: stakeholder_role_coverage
      default_weight: 0.18
      required: true
      description: Identification of users, sponsors, managers, reviewers, technical implementers, affected groups, and maintainers.
    - id: stakeholder_goals_incentives_and_burdens
      default_weight: 0.14
      required: true
      description: Attention to goals, pains, incentives, authority, constraints, risks, and resistance.
    - id: artifact_network_mapping
      default_weight: 0.14
      required: true
      description: Mapping neighboring systems, documents, processes, metrics, and practices.
    - id: boundary_conditions_and_claim_scope
      default_weight: 0.16
      required: true
      description: Explicit boundaries for validity, transfer, use, and contribution claims.
    - id: context_to_design_implications
      default_weight: 0.12
      required: true
      description: Trace from contextual conditions to objectives, requirements, design decisions, or evaluation design.
    - id: context_change_readiness
      default_weight: 0.08
      required: false
      description: Awareness of changes likely to affect artifact use, maintenance, or evaluation.
    decision_values:
    - adequate
    - adequate_with_gaps
    - requires_context_revision
    - insufficient_for_claims
    anti_patterns:
    - context_as_background_only
    - stakeholder_tokenism
    - boundary_condition_absence
    - artifact_network_blindness
    - unsupported_projectability
    dependencies:
    - problem_framing_quality_rubric
    source_families_to_consult:
    - zur Heiden context extraction
    - Hevner transparency extraction
    - concept_inventory.context_space
    - Wicked Problem Workflow
    prompt_id: prompt_context_stakeholder_adequacy_rubric
  - generation_order: 5
    id: requirements_traceability_rubric
    label: Requirements Traceability Rubric
    priority: core
    lifecycle_phase: requirements_and_design_targeting
    assessment_target: design_space.requirements_trace
    primary_question: Are objectives, requirements, acceptance criteria, design decisions, and evaluation criteria traceably
      derived from the problem and context?
    output_path: rubrics/requirements_traceability_rubric.yaml
    when_to_use: After problem/context formulation and before or during artifact specification.
    required_inputs:
    - problem_factors
    - stakeholder_needs
    - objectives
    - requirements
    - acceptance_criteria
    - design_decisions
    - evaluation_criteria
    required_outputs:
    - traceability_rating
    - broken_trace_links
    - unjustified_requirements
    - untested_requirements
    - revision_actions
    dimensions:
    - id: problem_to_objective_trace
      default_weight: 0.18
      required: true
      description: Evidence that objectives respond to problem factors and stakeholder needs.
    - id: objective_to_requirement_trace
      default_weight: 0.16
      required: true
      description: Translation of objectives into clear functional, nonfunctional, design, or meta-requirements.
    - id: acceptance_criterion_quality
      default_weight: 0.16
      required: true
      description: Testability, specificity, and relevance of acceptance criteria.
    - id: requirement_to_design_decision_trace
      default_weight: 0.16
      required: true
      description: Links from each key requirement to one or more design decisions or artifact capacities.
    - id: requirement_to_evaluation_alignment
      default_weight: 0.16
      required: true
      description: Links from requirements to evaluation criteria, methods, measures, and findings.
    - id: change_control_and_rationale
      default_weight: 0.1
      required: false
      description: Trace of requirement changes, rationale, and effect on artifact/evaluation.
    - id: coverage_and_gap_analysis
      default_weight: 0.08
      required: true
      description: Detection of orphan requirements, orphan design decisions, and untested acceptance criteria.
    decision_values:
    - trace_ready
    - minor_trace_gaps
    - major_trace_revision_needed
    - not_traceable
    anti_patterns:
    - solution_drift
    - orphan_requirement
    - untested_requirement
    - acceptance_criteria_absence
    - traceability_theater
    dependencies:
    - problem_framing_quality_rubric
    - context_stakeholder_adequacy_rubric
    source_families_to_consult:
    - DSR Operational Synthesis traceability edges
    - Alismail objectives framework extraction
    - Maedche problem-space extraction
    - concept_inventory.requirement
    prompt_id: prompt_requirements_traceability_rubric
  - generation_order: 6
    id: input_knowledge_solution_grounding_rubric
    label: Input Knowledge and Solution-Grounding Rubric
    priority: core
    lifecycle_phase: solution_space_grounding
    assessment_target: solution_space.input_knowledge
    primary_question: Is the artifact grounded in relevant prior knowledge, kernel theories, prior artifacts, methods, technologies,
      and design patterns?
    output_path: rubrics/input_knowledge_solution_grounding_rubric.yaml
    when_to_use: Before artifact design finalization and again when writing the contribution and rigor sections.
    required_inputs:
    - kernel_theories
    - prior_artifacts
    - design_patterns
    - methods
    - technologies
    - solution_alternatives
    - prior_solution_critique
    required_outputs:
    - solution_grounding_rating
    - knowledge_gaps
    - alternative_search_gaps
    - rationale_strength
    - misfit_warnings
    dimensions:
    - id: kernel_theory_and_descriptive_knowledge_fit
      default_weight: 0.16
      required: true
      description: Relevance and appropriate use of descriptive or explanatory knowledge.
    - id: prior_artifact_and_design_knowledge_coverage
      default_weight: 0.16
      required: true
      description: Engagement with relevant prior artifacts, design principles, patterns, methods, and architectures.
    - id: solution_alternative_search
      default_weight: 0.16
      required: true
      description: Evidence that multiple feasible design options were considered.
    - id: problem_solution_fit
      default_weight: 0.18
      required: true
      description: Alignment between problem mechanisms and selected solution logic.
    - id: source_quality_and_provenance
      default_weight: 0.12
      required: true
      description: Credibility, provenance, and relevance of source knowledge.
    - id: prior_solution_critique
      default_weight: 0.12
      required: true
      description: Explanation of why existing solutions are insufficient or require adaptation.
    - id: knowledge_to_design_trace
      default_weight: 0.1
      required: true
      description: Explicit trace from input knowledge to requirements, design decisions, or evaluation criteria.
    decision_values:
    - well_grounded
    - grounded_with_gaps
    - requires_solution_space_revision
    - ungrounded
    anti_patterns:
    - black_box_invention
    - theory_name_dropping
    - prior_artifact_neglect
    - single_solution_fixation
    - weak_solution_grounding
    dependencies:
    - requirements_traceability_rubric
    source_families_to_consult:
    - Theory of DSR rigor through knowledge base
    - Feine machine-executable descriptive knowledge extraction
    - Leimeister design pattern extraction
    - DSR Operational Synthesis solution_space
    prompt_id: prompt_input_knowledge_solution_grounding_rubric
  - generation_order: 7
    id: artifact_specification_quality_rubric
    label: Artifact Specification Quality Rubric
    priority: core
    lifecycle_phase: artifact_specification
    assessment_target: artifact_space
    primary_question: Is the DSR artifact or design entity specified clearly enough to distinguish reusable design knowledge
      from concrete implementation?
    output_path: rubrics/artifact_specification_quality_rubric.yaml
    when_to_use: During artifact definition, prototype design, repository packaging, and artifact/contribution review.
    required_inputs:
    - artifact_name
    - artifact_type
    - artifact_universal
    - artifact_instantiation
    - capacity_specification
    - make_plan
    - use_plan
    - artifact_boundary
    required_outputs:
    - artifact_specification_rating
    - artifact_boundary_gaps
    - make_use_capacity_gaps
    - instantiation_trace
    dimensions:
    - id: artifact_universal_vs_instantiation_distinction
      default_weight: 0.18
      required: true
      description: Clear distinction between reusable artifact/design entity and concrete prototype or implementation.
    - id: artifact_type_classification
      default_weight: 0.1
      required: true
      description: Appropriate artifact type such as construct, model, method, instantiation, design principle, framework,
        taxonomy, pattern, or architecture.
    - id: artifact_boundary_and_scope
      default_weight: 0.12
      required: true
      description: Definition of what the artifact includes, excludes, depends on, and assumes.
    - id: capacity_specification
      default_weight: 0.16
      required: true
      description: Functions, affordances, constraints, quality attributes, and expected capacities.
    - id: make_plan_quality
      default_weight: 0.14
      required: true
      description: Procedure and evidence for producing or maintaining the artifact.
    - id: use_plan_quality
      default_weight: 0.14
      required: true
      description: User roles, use context, steps, preconditions, and intended effects.
    - id: make_use_and_usage_effect_claims
      default_weight: 0.1
      required: true
      description: Separation of claims about making the artifact, using it, and producing intended effects.
    - id: artifact_network_fit
      default_weight: 0.06
      required: false
      description: Integration with neighboring artifacts, systems, processes, or practices.
    decision_values:
    - specification_ready
    - minor_specification_gaps
    - major_specification_revision_needed
    - artifact_not_specified
    anti_patterns:
    - artifact_black_box
    - implementation_artifact_conflation
    - capacity_absence
    - make_plan_absence
    - use_plan_absence
    - artifact_boundary_blur
    dependencies:
    - input_knowledge_solution_grounding_rubric
    - requirements_traceability_rubric
    source_families_to_consult:
    - Weigand artifact ontology extraction
    - Weber DSR artifact discussion
    - concept_inventory.artifact_space
    - DSR Operational Synthesis artifact operationalization
    prompt_id: prompt_artifact_specification_quality_rubric
  - generation_order: 8
    id: design_rationale_build_trace_rubric
    label: Design Rationale and Build Trace Rubric
    priority: recommended
    lifecycle_phase: design_and_build
    assessment_target: design_space.design_rationale_and_build_trace
    primary_question: Does the record explain why the artifact was designed as it was and how it was built or iterated?
    output_path: rubrics/design_rationale_build_trace_rubric.yaml
    when_to_use: During iterative build cycles and when preparing transparency or repository documentation.
    required_inputs:
    - design_decisions
    - alternatives_considered
    - rationale
    - iteration_log
    - build_evidence
    - version_history
    - design_constraints
    required_outputs:
    - build_trace_rating
    - rationale_gaps
    - alternative_gaps
    - iteration_trace_gaps
    - documentation_actions
    dimensions:
    - id: design_decision_identification
      default_weight: 0.14
