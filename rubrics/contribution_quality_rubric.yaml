      - akoka_et_al_2023:A08
      - akoka_et_al_2023:A10
      obligation_status: recommended
      use_in_rubric: supports knowledge_goal_and_scope and accumulation_and_reuse_potential
    - claim_id: src_claim_contribution_plurality
      claim: DSR contributions may take multiple forms and should not be reduced only to conventional descriptive theory.
      source_family: baskerville_baiyere_gregor_hevner_rossi_2018_dsr_contributions_extraction
      source_anchor_ids:
      - baskerville_et_al_2018:source_family
      obligation_status: recommended
      use_in_rubric: supports contribution_object_clarity and audience_and_communication_fit
    - claim_id: src_claim_accumulation_codification
      claim: DSR knowledge should be codified, comparable, reusable, replicable, and extendable to support cumulative science.
      source_family: reining_ahlemann_mueller_thakurta_2022_knowledge_accumulation_extraction
      source_anchor_ids:
      - reining_et_al_2022:source_family
