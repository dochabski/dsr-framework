rubric:
  rubric_metadata:
    id: contribution_quality_rubric
    label: Design-Knowledge Contribution Quality Rubric
    version: 0.1.0-draft
    status: draft
    generated_on: '2026-05-15'
    generated_by: gpt_5_5_thinking
    intended_file_path: rubrics/contribution_quality_rubric.yaml
    local_file_name: contribution_quality_rubric.yaml
    assessment_target: knowledge_space.contribution_claim
    priority: core
    lifecycle_phase: contribution_and_communication
    prompt_id: prompt_contribution_quality_rubric
    rubric_generation_spec_id: dsr_rubric_generation_spec_v0_1_0
    depends_on:
    - evaluation_alignment_quality_rubric
    - artifact_specification_quality_rubric
    documentation_protocol_alignment:
      identifier_policy: stable_ascii_lowercase_snake_case_for_ids_and_keys
      repository_path_policy: caller_places_file_manually; intended path retained as metadata
      traceability_policy: source_supported_claims_and_reviewer_judgment_are_distinguished
      obligation_policy: machine_validation_checks_presence_consistency_trace_shape_and_controlled_values; adequacy_judgments_remain_human_review
      scope_policy: theory_of_dsr_and_repository_operationalization_are_distinguished
  assessment_scope:
    primary_question: Is the contribution claim a justified, reusable or projectable design-knowledge contribution rather
      than only a local artifact report?
    when_to_use:
    - when drafting the DSR contribution statement
    - when reviewing whether evaluation findings support design-knowledge claims
    - when preparing a repository package for DSR contribution review
    - after artifact specification and evaluation alignment have been completed or provisionally reviewed
    - when revising a manuscript, thesis, repository README, practitioner guide, or contribution summary
    - whenever new evaluation evidence changes the maturity, scope, or boundary conditions of a claim
    when_not_to_use:
    - do not use before the artifact or design entity is minimally specified
    - do not use before there is at least some evaluation, demonstration, analysis, expert, case, field, or literature-based
      evidence to inspect
    - do not use as a substitute for evaluation_alignment_quality_rubric; contribution quality depends on but does not replace
      evaluation alignment
    - do not use as a substitute for artifact_specification_quality_rubric; this rubric assumes the contribution can be connected
      to a discernible artifact or design entity
    - do not use to certify statistical generalizability, production readiness, ethical approval, or legal compliance
    - do not use to force every DSR contribution into theory-heavy form when the valid contribution is a method, principle,
      pattern, evaluation insight, or artifact knowledge
    intended_users:
    - dsr_researcher
    - doctoral_student
    - faculty_advisor
    - repository_reviewer
    - methodologist
    - journal_or_conference_reviewer
    - quality_assurance_reviewer
    - practice_partner_reviewer
    - technical_implementer
    - artifact_maintainer
    - practitioner_audience_translator
    unit_of_assessment: one_knowledge_space_contribution_claim_record_for_a_candidate_or_active_dsr_study
    boundary_conditions:
    - The rubric assesses the claim that enters the knowledge base, not merely the quality of the artifact, implementation,
      or evaluation in isolation.
    - The rubric supports artifact contributions, design principles, design patterns, design theories, frameworks, taxonomies,
      methods, process models, evaluation knowledge, and mixed contribution forms.
    - A contribution can be narrow, idiographic, exploratory, or early-stage and still score well when it is clear, evidence-bounded,
      useful, and traceable.
    - Machine validation may check identifiers, required fields, controlled values, trace links, and file presence; novelty,
      evidence sufficiency, projectability, and overclaim risk remain human-review judgments.
    - Claims should be calibrated to artifact maturity and evaluation evidence; contribution quality is not measured by breadth
      alone.
    assumptions:
    - A DSR contribution should communicate reusable, projectable, or accumulable design knowledge rather than merely reporting
      a local artifact.
    - Contribution claims should be constrained by the artifact specification, evaluation findings, knowledge goal, knowledge
      scope, novelty mode, and boundary conditions.
    - Design knowledge may be embodied in an artifact, method, principle, pattern, theory, framework, taxonomy, evaluation
      result, or process model, but it must be explicitly articulated.
    - Repository-ready contribution documentation should preserve source anchors, evidence-to-claim traceability, and reviewer-judgment
      boundaries.
  source_grounding:
