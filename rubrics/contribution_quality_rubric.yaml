    - baskerville_baiyere_gregor_hevner_rossi_2018_dsr_contributions_extraction
    - reining_ahlemann_mueller_thakurta_2022_knowledge_accumulation_extraction
    - schwartz_yahav_2021_knowledge_contribution_diagrams_extraction
    - dsr_operational_synthesis.contribution_sections
    - theory_of_design_science_research.knowledge_space_and_contribution_sections
    - concept_inventory.knowledge_space
    - concept_inventory.contribution_claim
    - dsr_skos_controlled_vocabulary.knowledge_contribution_terms
    - dsr_ontology_competency_questions.knowledge_space
    - evaluation_alignment_quality_rubric
    - artifact_specification_quality_rubric
    required_framework_files:
    - concept-inventory_v2.yaml
    - DSR Operational Synthesis.txt
    - Theory of Design Science Research.txt
    - dsr-source-operational-extractions-unified-part001.yaml
    - dsr-source-operational-extractions-unified-part002.yaml
    - dsr_skos_controlled_vocabulary.yaml
    - dsr_ontology_competency_questions.yaml
    - dsr_rubric_generation_spec_v0_1_0.yaml
    - dsr_rubric_generation_prompts_v0_1_0.txt
    - evaluation_alignment_quality_rubric.yaml
    - artifact_specification_quality_rubric.yaml
    source_anchor_policy:
      minimum: Each major contribution rationale should cite at least one source_anchor_id, framework_anchor, repository_artifact,
        or reviewer_judgment marker.
      preferred: Use extraction-record anchors for knowledge goal, knowledge scope, contribution type, evaluation evidence,
        projectability, and accumulation claims where available.
      do_not_do: Do not treat reviewer judgment, local stakeholder preference, or artifact success rhetoric as source-supported
        design knowledge unless evidence and source anchors support that status.
    unsupported_claim_policy:
      rule: Claims about novelty, projectability, maturity, contribution type, and general usefulness must be marked unsupported
        when they lack evidence or source anchors.
      effect: Unsupported claims trigger human_review and may activate non_compensatory_floor_rules or major_claim_revision.
    source_supported_claims:
    - claim_id: src_claim_dsr_requires_design_knowledge_contribution
      claim: DSR should communicate a design-knowledge contribution rather than only a local artifact report.
      source_family: theory_of_design_science_research.consensus_commitments
      source_anchor_ids:
      - theory_synthesis:2.consensus_commitments.design_knowledge_contribution
      obligation_status: required
      use_in_rubric: supports contribution_object_clarity and routine_design_and_overclaim_risk
    - claim_id: src_claim_knowledge_goal_scope_paths
      claim: DSR knowledge contributions can be characterized by knowledge goals, knowledge scope, and paths of knowledge
        types.
      source_family: akoka_comyn_wattiau_prat_storey_2023_paths_of_knowledge_types_extraction
      source_anchor_ids:
