  examples_or_scoring_vignettes:
  - vignette_id: exemplary_strong_context
    label: Exemplary strong context record
    case_summary: A higher education DSR study proposes a curriculum-aligned quality-assurance artifact. The record identifies institutional governance, accreditation
      constraints, Canvas/CourseLeaf/Concourse dependencies, faculty and reviewer roles, student and maintainer burdens, data-access limits, artifact-network dependencies,
      and claim-specific boundaries. Context factors trace to requirements, design decisions, evaluation criteria, and projectability constraints.
    indicative_scores:
      context_completeness: 4
      stakeholder_role_coverage: 4
      stakeholder_goals_incentives_and_burdens: 4
      artifact_network_mapping: 4
      boundary_conditions_and_claim_scope: 4
      context_to_design_implications: 4
      context_change_readiness: 3
    expected_decision: adequate
    why: The record supports design and evaluation interpretation and explicitly bounds claims beyond the local setting.
    revision_actions:
    - Maintain update triggers for governance, system, and policy changes.
  - vignette_id: borderline_conditional_context
    label: Borderline context record with manageable gaps
    case_summary: A DSR study describes the local department, primary users, sponsor, and technical environment. It lists major systems but not document flows or
      metrics. Stakeholder goals are partly described, but maintainers and affected non-users are missing. Boundary conditions mention institutional setting and pilot
      scope but do not yet define adaptation requirements.
    indicative_scores:
      context_completeness: 2
      stakeholder_role_coverage: 2
      stakeholder_goals_incentives_and_burdens: 2
      artifact_network_mapping: 2
      boundary_conditions_and_claim_scope: 2
      context_to_design_implications: 2
      context_change_readiness: 1
    expected_decision: adequate_with_gaps
    why: The record may support continued early design work, but projectability and evaluation claims should remain limited until stakeholder, artifact-network, and
      boundary gaps are resolved.
    revision_actions:
    - Add maintainer and affected-group profiles.
    - Map document, metric, and workflow dependencies.
    - Link pilot constraints to evaluation and contribution claim scope.
  - vignette_id: weak_not_ready_context
    label: Weak context record not ready for claims
    case_summary: A record states that universities need an AI workflow and claims it will improve quality assurance broadly. It does not specify local context, stakeholder
      roles, governance or resource constraints, neighboring systems, boundary conditions, or how context shaped the design. It provides no evidence for transfer
      beyond the case.
    indicative_scores:
      context_completeness: 1
      stakeholder_role_coverage: 1
      stakeholder_goals_incentives_and_burdens: 0
      artifact_network_mapping: 0
      boundary_conditions_and_claim_scope: 0
      context_to_design_implications: 0
      context_change_readiness: 0
    expected_decision: insufficient_for_claims
    why: Critical context, stakeholder, boundary, and trace evidence is absent, and broad projectability claims are unsupported.
    revision_actions:
    - Rebuild context description from field, system, policy, and stakeholder evidence.
    - Create stakeholder map and burden/value analysis.
    - Add artifact-network map and boundary-condition register.
    - Restrict contribution claims until context evidence is adequate.
  - vignette_id: confidential_context_with_responsible_redaction
    label: Sensitive context with responsible abstraction
    case_summary: A compliance-oriented DSR record cannot disclose some institutional policies or system details publicly. It provides abstracted context dimensions,
      protected source anchors, reviewer-access notes, redaction rationale, boundary conditions, and trace links from nonpublic governance constraints to design decisions
      and evaluation limits.
    indicative_scores:
      context_completeness: 3
      stakeholder_role_coverage: 3
      stakeholder_goals_incentives_and_burdens: 3
      artifact_network_mapping: 3
      boundary_conditions_and_claim_scope: 4
      context_to_design_implications: 3
      context_change_readiness: 2
    expected_decision: adequate_with_gaps
    why: Responsible redaction does not automatically lower adequacy when material implications remain interpretable and reviewers have a protected path to verify
      evidence.
    revision_actions:
    - Confirm protected-review access for sensitive evidence.
    - Monitor whether redaction prevents external projectability interpretation.
  interpretation_guidance:
    how_to_read_scores:
    - Use the weighted score to summarize adequacy, but interpret the final decision through floor rules and human-review flags.
    - A high context score means the context_space record is adequate for interpreting claims at the current lifecycle phase; it does not independently validate the
      artifact or contribution.
    - Lower scores should be converted into targeted revision actions, especially missing stakeholders, boundary gaps, artifact-network gaps, and context-to-design
      trace gaps.
    - The threshold for adequacy rises when the record makes broad contribution, projectability, field evaluation, implementation, or stakeholder value claims.
    what_not_to_infer:
    - Do not infer that the artifact is useful, effective, ethical, adopted, or transferable merely because context is well documented.
    - Do not infer stakeholder consent, participation quality, or benefit from the presence of a stakeholder map.
    - Do not infer that a boundary condition is empirically validated merely because it is stated.
    - Do not infer that all relevant context has been captured; the rubric assesses adequacy relative to current claims and lifecycle phase.
    - Do not infer that machine validation can determine contextual adequacy, stakeholder representativeness, ethical acceptability, or projectability sufficiency.
    - Do not infer that a low score means the project should be abandoned; it may mean the context record must be revised before stronger design/evaluation/contribution
      claims are made.
    - Do not infer that redacted context is inadequate when responsible abstraction and protected-review evidence are provided.
    relationship_to_adjacent_rubrics:
      problem_framing_quality_rubric: This rubric depends on problem framing and extends stakeholder and boundary analysis into the broader context_space.
      requirements_traceability_rubric: This rubric checks whether context implications exist; the requirements rubric checks whether objectives, requirements, design
        decisions, and evaluation criteria are traceably and well formed.
      artifact_specification_quality_rubric: Artifact-network findings and use-context constraints should feed artifact boundary, capacity, make-plan, and use-plan
        specification.
      evaluation_alignment_quality_rubric: Evaluation setting, participants, criteria, and evidence modes should reflect context and stakeholder analysis.
      projectability_boundary_conditions_rubric: This rubric identifies boundaries and projectability constraints; the projectability rubric assesses transfer/reuse/adaptation
        logic in greater detail.
    known_limitations:
    - The rubric is not a full stakeholder-participation or co-design quality instrument.
    - The rubric does not replace domain-specific compliance, privacy, security, IP, accessibility, or ethics review.
    - The rubric assumes the repository's DSR ontology and controlled vocabulary are still evolving; validation implications should be treated as draft guidance.
    - The rubric cannot guarantee completeness of context in wicked or changing environments.
  quality_control:
    completeness_check:
    - All seven required dimensions are present.
    - Weights sum to 1.0.
    - Every dimension includes 0-4 descriptors, evidence requirements, calibration anchor, weak-evidence signals, failure modes, and reviewer notes.
    - Required inputs and outputs match the rubric generation prompt.
    - Decision values match adequate, adequate_with_gaps, requires_context_revision, and insufficient_for_claims.
    - At least three scoring vignettes are included.
    - The what_not_to_infer section is present.
    ambiguity_check:
    - Identify which context fields are source-supported, which are inferred, and which are reviewer judgment.
    - Flag ambiguous stakeholder roles, governance boundaries, and artifact-network dependencies.
    - Flag generic context language that may hide material variation.
    - Flag confidentiality or redaction cases that require protected-review handling.
    human_review_recommendation:
      default: human_review_recommended_for_all_scores_below_adequate
      always_review_when:
      - boundary_conditions_and_claim_scope < 3 and broad contribution claims are present
      - stakeholder_goals_incentives_and_burdens < 3 and user value or burden reduction claims are present
      - ethical, privacy, security, IP, governance, or burden risks are present
      - context evidence is redacted, contested, stale, or based primarily on reviewer judgment
    source_gap_notes:
    - The zur Heiden context extraction supports context-dimension and context-to-design guidance primarily as recommended reporting guidance, not as universal hard
      validation.
    - The Hevner transparency extraction cautions against premature detailed checklists; use SHACL/JSON Schema for presence and trace structure, not final adequacy.
    - The concept inventory provides framework definitions but does not by itself supply empirical evidence for a specific project's context claims.
    machine_readability_check:
    - All identifiers use lowercase snake_case.
    - Decision values and anti-pattern IDs are controlled values.
    - Dimension IDs match the generation index and prompt.
    - No free-text score labels replace numeric 0-4 descriptors.
