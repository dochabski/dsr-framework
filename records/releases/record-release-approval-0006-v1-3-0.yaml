release_approval_record:
  record_id: record_release_approval_0006_v1_3_0
  record_class: release_approval
  item_type: record
  title: v1.3.0 Minor Release Approval
  status: approved
  version: "1.3.0"
  approval_date: "2026-05-16"
  responsible_party: framework_maintainer
  target_release: v1.3.0
  approved_release_tag: v1.3.0
  approved_package_conformance: l4_reusable_stable
  l5_claimed: false

  approved_commit:
    commit_sha: pending_until_release_preparation_commit
    branch: main
    approval_scope_note: >
      This release-preparation commit adds the rubric directory, generated unified
      rubric collection, rubric collection builder, and retained v1.3.0 metadata,
      release, and approval records. The exact approved commit is the final
      main-branch commit tagged as v1.3.0.

  approval_basis:
    minor_release_record: records/releases/record-release-0007-v1-3-0.yaml
    minor_metadata_freeze: records/releases/record-metadata-freeze-0006-v1-3-0.yaml
    validation_summary: records/validation/validation-summary-latest.json
    rubric_directory_readme: rubrics/README.md
    unified_rubric_collection: rubrics/dsr_assessment_rubrics_unified.yaml
    v1_2_0_release_approval: records/releases/record-release-approval-0005-v1-2-0.yaml

  validation_commands:
    - command: python scripts/build-rubric-collection.py --date 2026-05-16
      required_result: pass
    - command: python scripts/validate-package.py --write-summary
      required_result: pass
    - command: python scripts/validate-package.py --release-candidate --write-summary
      required_result: pass
    - command: git diff --check
      required_result: pass

  approval_statement: >
    The DSR Framework v1.3.0 minor release is approved as an L4 reusable-stable
    GitHub release. The release is not approved as L5 archival/publication-ready.

  post_release_actions:
    - tag release commit as v1.3.0
    - create GitHub release using records/releases/github-release-notes-v1-3-0.md
    - verify release artifacts and source archives
    - update Zenodo metadata and archive after explicit publication confirmation

  outcome:
    result: approved_for_github_minor_release
    approved_claims:
      - v1_3_0_stable
      - l4_reusable_stable
    not_approved_claims:
      - l5_archival_publication_ready
      - empirical_external_reuse_validation
      - downstream_artifact_certification

  retention_rule:
    retention_period: permanent_while_package_is_active
    supersession_rule: Supersede only with a later retained release approval.
